name: Verifier les portees Shopify accordees

# Lecture seule : demande a Shopify quelles portees l'app a REELLEMENT
# obtenues (currentAppInstallation.accessScopes). Publier une nouvelle
# version ne suffit pas — le marchand doit approuver les nouvelles portees,
# sinon le token garde les anciennes. Cette sonde tranche la question sans
# deviner. Declenchee par push du fichier .github/check-scopes-trigger.

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/shopify-fees-margins-81q385"]
    paths: [".github/check-scopes-trigger"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Quel commit est reellement deploye
        run: |
          curl -sS --max-time 60 https://kindred-m-numbers.vercel.app/api/admin/env-check \
            | grep -o '"deployedCommit":"[^"]*"' || echo "deployedCommit introuvable"
          echo "--- commit attendu (HEAD de la branche par defaut) ---"
          git ls-remote https://github.com/Badr-Bot/KindredM-Numbers refs/heads/claude/kindredm-dashboard-setup-epbxha

      - name: Lire les portees accordees
        run: |
          curl -sS --max-time 60 -w "\nHTTP %{http_code}\n" \
            https://kindred-m-numbers.vercel.app/api/admin/scopes || true
