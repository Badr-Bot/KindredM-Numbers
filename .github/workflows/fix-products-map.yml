name: Fix products map (rebranding 05/08)

# Les runners GitHub joignent le dashboard Vercel là où l'environnement de
# travail de Claude en est empêché (proxy). Ce workflow fait, sans navigateur :
#   1. état de santé de l'app (env-check) — diagnostique aussi les
#      « erreurs de connexion » vues depuis /admin ;
#   2. charge dans products_map les titres exacts issus du rebranding
#      « rues parisiennes » (le moteur mappe par titre exact : sans ces
#      lignes, les ventes postérieures au renommage sortent du comptage) ;
#   3. relance la synchro (rescan J-7) pour re-classer les commandes du jour ;
#   4. relit le compteur de mapping pour prouver l'écriture.
# Idempotent : l'upsert est en onConflict(store,title_pattern), relançable
# sans risque.

on:
  workflow_dispatch: {}
  # Le connecteur GitHub de la session n'a pas le droit de dispatch (403) :
  # le push de ce fichier (ou du fichier declencheur) lance le job.
  push:
    branches: ["claude/kindredm-dashboard-setup-epbxha"]
    paths:
      - ".github/workflows/fix-products-map.yml"
      - ".github/fix-map-trigger"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Sante de l'app (env-check)
        run: |
          set -x
          curl -sS --max-time 60 -w "\nHTTP %{http_code}\n" \
            https://kindred-m-numbers.vercel.app/api/admin/env-check || true

      - name: 2. Charger le mapping des titres (nouveaux noms + E-Book)
        run: |
          set -e
          # Heredoc et non chaine entre quotes simples : le titre FR contient
          # une apostrophe ("L'art de sublimer...") qui casserait le shell.
          cat > /tmp/rows.json <<'JSON'
          {"rows":[
            {"store":"FR","title_pattern":"Le Polo Marceau","product_key":"POLO","unit_group":"polo"},
            {"store":"FR","title_pattern":"Le Gilet Sully","product_key":"GILET","unit_group":"upsell"},
            {"store":"FR","title_pattern":"Le Pantalon Rivoli","product_key":"DRESS_TROUSERS","unit_group":"upsell"},
            {"store":"FR","title_pattern":"La Chemise Turenne","product_key":"SHORT_SLEEVE_DRESS_SHIRT","unit_group":"upsell"},
            {"store":"FR","title_pattern":"Le Short Cassini","product_key":"CHINO_SHORTS","unit_group":"upsell"},
            {"store":"FR","title_pattern":"La Chemise Turenne — Édition Manches Courtes","product_key":"SHORT_SLEEVE_DRESS_SHIRT","unit_group":"upsell"},
            {"store":"FR","title_pattern":"Le Débardeur Compression","product_key":"COMPRESSION_TANK_TOP","unit_group":"upsell"},
            {"store":"FR","title_pattern":"Nivafit — Caleçon Ultra Extensible","product_key":"CALECON","unit_group":"upsell"},
            {"store":"ES","title_pattern":"Nivafit — Calzoncillo Ultraelástico","product_key":"CALECON","unit_group":"upsell"},
            {"store":"FR","title_pattern":"E-Book : L'art de sublimer sa carrure et de maîtriser son style","product_key":"EBOOK","unit_group":"upsell"},
            {"store":"ES","title_pattern":"E-Book: El arte de realzar tu figura y dominar tu estilo","product_key":"EBOOK","unit_group":"upsell"}
          ]}
          JSON
          OUT=$(curl -sS --max-time 60 -w "\nHTTP:%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            --data-binary @/tmp/rows.json \
            https://kindred-m-numbers.vercel.app/api/admin/products-map)
          echo "$OUT"
          echo "$OUT" | grep -q 'HTTP:200' || { echo "ECHEC: upsert products_map refuse"; exit 1; }

      - name: 3. Resynchroniser (insiste jusqu'a un vrai passage, ran=true)
        run: |
          set -e
          # La synchro est throttlee a 1 passage / 5 min et le cron keep-sync
          # gagne souvent la course : on reessaie chaque 65 s jusqu'a obtenir
          # un passage reellement execute, dont on affiche le resultat complet
          # (compteurs + avertissements produits non mappes = la preuve).
          for i in 1 2 3 4 5 6 7; do
            OUT=$(curl -sS --max-time 290 -X POST https://kindred-m-numbers.vercel.app/api/sync)
            echo "tentative $i : $OUT"
            if echo "$OUT" | grep -q '"ran":true'; then
              echo "=== PASSAGE REEL OBTENU ==="
              exit 0
            fi
            sleep 65
          done
          echo "AVERTISSEMENT : que des passages throttles — le cron a synchronise entre-temps (voir ses runs)."

      - name: 4bis. Diagnostic — lignes daily_aggregates du jour et de la veille
        run: |
          for D in $(date -u +%F) $(date -u -d "yesterday" +%F); do
            echo "=== $D ==="
            curl -sS --max-time 60 "https://kindred-m-numbers.vercel.app/api/admin/day-aggregates?day=$D" || true
            echo
          done

      - name: 4. Preuve — compteur products_map
        run: |
          curl -sS --max-time 60 -w "\nHTTP %{http_code}\n" \
            https://kindred-m-numbers.vercel.app/api/admin/products-map
